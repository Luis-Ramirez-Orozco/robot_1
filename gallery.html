<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="format-detection" content="telephone=no" />
<title>Gallery — Robot Shows</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="calendar.css?v=2" />
<style>
  html, body { margin: 0; min-height: 100%; background: #101010; color: #ececec; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

  .page-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 0.75rem;
    padding: 1.25rem 1.75rem 0.5rem;
  }

  .page-nav .site-title {
    color: #ececec;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    text-decoration: none;
  }

  .page-nav .nav-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .page-nav .nav-links a {
    color: #ffffff;
    text-decoration: none;
    white-space: nowrap;
  }

  .page-nav #book-now-link {
    padding: 0.55rem 1.3rem;
    border-radius: 999px;
    background: #ffffff;
    color: #000000;
    font-weight: 700;
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .page-nav #book-now-link:hover {
    transform: translateY(-1px);
    box-shadow: 0 0 26px rgba(255, 255, 255, 0.55);
  }

  /* Phones: centered title with the links centered beneath it. */
  @media (max-width: 767px) {
    .page-nav {
      flex-direction: column;
      justify-content: center;
      padding: 1.25rem 1rem 0.5rem;
    }
    .page-nav .nav-links {
      justify-content: center;
    }
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.75rem 6rem;
  }

  .gallery-layout {
    display: flex;
    align-items: flex-start;
    gap: 1.5rem;
    margin-top: 1rem;
    text-align: left;
  }

  .gallery-video {
    position: relative;
    flex: 0 0 340px;
    border-radius: 1rem;
    overflow: hidden;
    background: #000;
  }

  .gallery-video video {
    display: block;
    width: 100%;
  }

  .gallery-video-nav {
    position: absolute;
    top: 50%;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    transform: translateY(-50%);
    border: none;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    color: #ececec;
    cursor: pointer;
  }

  .gallery-video-nav:hover {
    background: rgba(0, 0, 0, 0.7);
  }

  .gallery-video-prev {
    left: 0.6rem;
  }

  .gallery-video-next {
    right: 0.6rem;
  }

  .gallery-carousel {
    flex: 1;
    min-width: 0;
  }

  .gallery-viewport {
    overflow: hidden;
  }

  .gallery-grid {
    display: flex;
    transition: transform 0.45s ease;
  }

  .gallery-page {
    flex: 0 0 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: min-content;
    gap: 0.625rem;
  }

  .gallery-pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-top: 1rem;
  }

  .gallery-pager-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem;
    height: 2.5rem;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
    color: #ececec;
    cursor: pointer;
  }

  .gallery-pager-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.2);
  }

  .gallery-pager-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .gallery-dots {
    display: flex;
    gap: 0.5rem;
  }

  .gallery-dot {
    width: 0.5rem;
    height: 0.5rem;
    padding: 0;
    border: none;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.3);
    cursor: pointer;
  }

  .gallery-dot.is-active {
    background: #ffffff;
  }

  .gallery-thumb {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: none;
    margin: 0;
    padding: 0;
    border-radius: 0.75rem;
    overflow: hidden;
    background: none;
    font: inherit;
    cursor: pointer;
  }

  .gallery-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
  }

  .gallery-thumb:hover img {
    transform: scale(1.04);
  }

  /* --- Photo lightbox, reusing the calendar popup's look ---------------- */

  .photo-lightbox-modal {
    position: relative;
    max-width: min(92vw, 900px);
    width: auto;
    padding: 0.75rem;
  }

  .photo-lightbox-modal img {
    display: block;
    width: 100%;
    max-height: 80vh;
    border-radius: 0.75rem;
    object-fit: contain;
    background: #000;
  }

  .photo-lightbox-modal .calendar-close {
    position: absolute;
    top: 1.25rem;
    right: 1.25rem;
    background: rgba(0, 0, 0, 0.5);
  }

  .photo-lightbox-modal .calendar-close:hover {
    background: rgba(0, 0, 0, 0.75);
  }

  /* Desktop: size the video and 3x3 grid so the whole page fits one screen.
     --thumb is the largest square that fits both the height and the width. */
  @media (min-width: 769px) {
    main {
      max-width: none;
      padding-bottom: 1.5rem;
    }
    .gallery-layout {
      --gap: 0.625rem;
      --pager: 3.5rem;
      --avail-h: calc(100vh - 6.875rem);
      --avail-w: calc(100vw - 3.5rem - 1.5rem);
      --thumb: min(
        calc((var(--avail-h) - 2 * var(--gap) - var(--pager)) / 3),
        calc((var(--avail-w) - 2 * var(--gap) - 0.5625 * (2 * var(--gap) + var(--pager))) / 4.6875)
      );
      justify-content: center;
    }
    .gallery-video {
      flex: 0 0 auto;
      height: calc(3 * var(--thumb) + 2 * var(--gap) + var(--pager));
      aspect-ratio: 9 / 16;
    }
    .gallery-video video {
      height: 100%;
      object-fit: contain;
    }
    .gallery-carousel {
      flex: 0 0 auto;
      width: calc(3 * var(--thumb) + 2 * var(--gap));
    }
  }

  @media (max-width: 768px) {
    .gallery-layout {
      flex-direction: column;
    }
    .gallery-video {
      flex-basis: auto;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      /* Fixed shape so the player doesn't collapse while the next clip
         loads, which made the page jump on phones. */
      aspect-ratio: 9 / 16;
    }
    .gallery-video video {
      height: 100%;
      object-fit: contain;
    }
    .gallery-carousel {
      width: 100%;
    }
  }
</style>
</head>
<body>

<nav class="page-nav">
  <a class="site-title" href="index.html">LA Bot Shows</a>
  <div class="nav-links">
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About Us</a>
    <a href="#" id="book-now-link">Book Now</a>
  </div>
</nav>

      </button>

        <img src="images/Gallery/web/IMG_4084.jpg" alt="Robot in LED costume, photo 17" loading="lazy" />
      </button>
    </div>
      </div>
      <div class="gallery-pager" id="gallery-pager">
        <button type="button" class="gallery-pager-btn" id="gallery-prev" aria-label="Previous photos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

</main>

<div id="photo-lightbox" class="calendar-overlay" aria-hidden="true">
  <div class="calendar-modal photo-lightbox-modal" role="dialog" aria-modal="true" aria-label="Photo preview">
    <button type="button" class="calendar-close" id="photo-lightbox-close" aria-label="Close">&times;</button>
    <img id="photo-lightbox-img" src="" alt="" />
  </div>
</div>

<script src="calendar.js?v=2"></script>
<script>
(function () {
  // Add more clips here as they're added to images/Gallery/.
  var VIDEOS = [
    "images/Gallery/part-1-portrait.mp4",
    "images/Gallery/flip-it.mov",
    "images/Gallery/IMG_8820.mov",
    "images/Gallery/IMG_8845.mov",
    "images/Gallery/IMG_8856.mov",
    "images/Gallery/IMG_8860.mov",
    "images/Gallery/4D968CE4-E919-4CEE-B43B-03461EC7D490.mov",
    "images/Gallery/8A2AC100-7095-48B0-B978-5747D18BD2F8.mov",
    "images/Gallery/B8912D52-BAEF-49B2-9618-E8B45B779DFA.mov",
    "images/Gallery/IMG_0052.mov",
    "images/Gallery/IMG_0055.MOV",
    "images/Gallery/IMG_1360.MOV",
    "images/Gallery/IMG_7364.mov",
    "images/Gallery/IMG_7365.MOV",
    "images/Gallery/IMG_7907.mov",
    "images/Gallery/IMG_7908.mov",
    "images/Gallery/IMG_7909.mov",
    "images/Gallery/IMG_7916.mov",
    "images/Gallery/IMG_3835.mov",
    "images/Gallery/IMG_3836.mov",
    "images/Gallery/IMG_3837.mov",
    "images/Gallery/IMG_3842.mov",
    "images/Gallery/IMG_3918.mov",
    "images/Gallery/IMG_3923.mov",
    "images/Gallery/IMG_3929.mov",
    "images/Gallery/IMG_3933.mov",
    "images/Gallery/IMG_3935.mov",
    "images/Gallery/IMG_3949.mov",
    "images/Gallery/IMG_3988.mov",
    "images/Gallery/IMG_3990.mov",
    "images/Gallery/IMG_4024.MOV",
    "images/Gallery/IMG_4057.mov",
    "images/Gallery/IMG_4058.mov",
    "images/Gallery/IMG_4067.mov",
    "images/Gallery/IMG_4074.mov",
    "images/Gallery/IMG_4158.mov",
    "images/Gallery/IMG_4159.mov",
    "images/Gallery/IMG_4166.mov",
    "images/Gallery/IMG_4173.mov",
    "images/Gallery/IMG_4175.mov"
  ];
  var index = 0;

  var video = document.getElementById("gallery-video-player");
  var source = document.getElementById("gallery-video-source");
  var prevBtn = document.getElementById("gallery-video-prev");
  var nextBtn = document.getElementById("gallery-video-next");

  function show(i) {
    // Keep the visitor where they were on the page while the clip swaps.
    var scrollY = window.scrollY;
    index = (i + VIDEOS.length) % VIDEOS.length;
    source.src = VIDEOS[index];
    video.load();
    video.play().catch(function () {});
    window.scrollTo(0, scrollY);
    video.addEventListener("loadedmetadata", function () {
      window.scrollTo(0, scrollY);
    }, { once: true });
  }

  prevBtn.addEventListener("click", function () { show(index - 1); });
  nextBtn.addEventListener("click", function () { show(index + 1); });

  // Photo carousel: splits the thumbnails into pages of 9 (a 3x3 grid).
  var PER_PAGE = 9;
  var track = document.getElementById("gallery-track");
  var pager = document.getElementById("gallery-pager");
  var dotsWrap = document.getElementById("gallery-dots");
  var pagePrev = document.getElementById("gallery-prev");
  var pageNext = document.getElementById("gallery-next");
  var allThumbs = Array.prototype.slice.call(track.querySelectorAll(".gallery-thumb"));
  var pageCount = Math.ceil(allThumbs.length / PER_PAGE);
  var page = 0;
  var dots = [];

  for (var p = 0; p < pageCount; p++) {
    var pageEl = document.createElement("div");
    pageEl.className = "gallery-page";
    allThumbs.slice(p * PER_PAGE, (p + 1) * PER_PAGE).forEach(function (t) { pageEl.appendChild(t); });
    track.appendChild(pageEl);

    var dot = document.createElement("button");
    dot.type = "button";
    dot.className = "gallery-dot";
    dot.setAttribute("aria-label", "Photo page " + (p + 1));
    dot.addEventListener("click", showPage.bind(null, p));
    dotsWrap.appendChild(dot);
    dots.push(dot);
  }

  function showPage(i) {
    page = Math.max(0, Math.min(pageCount - 1, i));
    track.style.transform = "translateX(-" + page * 100 + "%)";
    pagePrev.disabled = page === 0;
    pageNext.disabled = page === pageCount - 1;
    dots.forEach(function (d, j) { d.classList.toggle("is-active", j === page); });
  }

  pagePrev.addEventListener("click", function () { showPage(page - 1); });
  pageNext.addEventListener("click", function () { showPage(page + 1); });
  if (pageCount < 2) pager.style.display = "none";
  showPage(0);

  // Photo lightbox: opens full-res images in-page instead of a new tab.
  var lightbox = document.getElementById("photo-lightbox");
  var lightboxImg = document.getElementById("photo-lightbox-img");
  var lightboxClose = document.getElementById("photo-lightbox-close");
  var thumbs = Array.prototype.slice.call(document.querySelectorAll(".gallery-thumb"));
  var lightboxLastFocused = null;

  function openLightbox(fullSrc, alt) {
    lightboxLastFocused = document.activeElement;
    lightboxImg.src = fullSrc;
    lightboxImg.alt = alt || "";
    lightbox.classList.add("is-open");
    lightbox.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    lightboxClose.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove("is-open");
    lightbox.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    lightboxImg.src = "";
    if (lightboxLastFocused && lightboxLastFocused.focus) lightboxLastFocused.focus();
  }

  thumbs.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var img = btn.querySelector("img");
      openLightbox(btn.dataset.full, img ? img.alt : "");
    });
  });

  lightboxClose.addEventListener("click", closeLightbox);
  lightbox.addEventListener("click", function (e) {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && lightbox.classList.contains("is-open")) closeLightbox();
  });
})();
</script>
</body>
</html>
